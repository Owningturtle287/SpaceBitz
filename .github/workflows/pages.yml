name: Deploy SpaceBitz
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check simulation and rendering regressions
        run: |
          npm run check:release
          npm test
          npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check startup, zoom, clearing and warp in a real browser
        timeout-minutes: 5
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/check-browser.mjs
      - name: Check native audio, offline shell and safe app updates
        timeout-minutes: 3
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: .qa/*.png
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: browser-checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage the verified runtime assets
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
