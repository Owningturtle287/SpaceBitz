<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Explore a living pocket galaxy. Follow real orbital rhythms, find habitable worlds and leave your mark among the stars.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preload" href="./assets/spacebitz-pixel.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <title>SpaceBitz — The small universe</title>
</head>
<body>
  <canvas id="sky" aria-label="SpaceBitz space exploration game"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="app" hidden>
    <header class="topbar">
      <aside class="mission glass mission-dropdown top-system-chart" id="systemChart" aria-live="polite">
        <button id="systemChartToggle" class="mission-toggle" type="button" aria-expanded="false" aria-controls="systemChartContent">
          <span class="mission-toggle-copy"><span class="eyebrow" id="modeLabel">ORBITAL / SYSTEM</span><strong id="placeLabel">Sol</strong></span>
          <span class="mission-chevron" aria-hidden="true">⌄</span>
        </button>
        <div id="systemChartContent" class="mission-content" hidden>
          <p id="hint">Select a world to explore.</p>
          <div id="zoneLegend" class="legend"><i></i> TEMPERATE ZONE <button id="zoneToggle" type="button" class="text-button" aria-pressed="true">ON</button></div>
          <div id="surfaceInfo" class="surface-info" hidden></div>
          <div id="bodyList" class="body-list" aria-label="Celestial bodies"></div>
          <button id="systemFit" class="text-button" type="button">FIT SYSTEM</button>
        </div>
      </aside>
      <div class="top-actions">
        <div id="flightReadout" class="flight-readout glass">
          <span id="clock">01 JAN 2026</span>
          <div id="telemetry" hidden><span id="coordsReadout" hidden></span><span id="fpsReadout" hidden></span></div>
        </div>
        <div class="utility-stack">
          <button id="settingsOpen" class="icon-button settings-button utility-button" aria-label="Open settings"><span class="settings-glyph" aria-hidden="true"></span><span class="utility-label">SET</span></button>
          <button id="journalButton" class="icon-button log-button utility-button" aria-label="Open voyage log"><span class="log-glyph" aria-hidden="true">▤</span><span class="utility-label">LOG</span></button>
        </div>
      </div>
    </header>
    <section class="target glass target-minimal" id="targetCard" aria-live="polite" hidden>
      <div class="target-line"><h2 id="targetName">Chart a course</h2></div>
      <p id="targetDistance" class="target-distance"></p>
      <div class="target-actions"><button id="primaryAction" class="button primary">TRAVEL</button><button id="secondaryAction" class="button subtle" hidden>INFO</button></div>
    </section>
    <div id="joystick" class="joystick" aria-label="Movement joystick" role="application"><div id="stick"></div></div>
    <div id="navigationControls" class="navigation-controls">
    <button id="homeButton" class="center-button hud-float" type="button" aria-label="Recenter view">
      <svg class="center-reticle" viewBox="0 0 24 24" aria-hidden="true" shape-rendering="crispEdges">
        <path fill="#8ee9d4" d="M2 2h7v2H4v5H2zm13 0h7v7h-2V4h-5zM2 15h2v5h5v2H2zm18 0h2v7h-7v-2h5zM11 5h2v4h-2zm0 10h2v4h-2zM5 11h4v2H5zm10 0h4v2h-4z"/>
        <path fill="#35556d" d="M9 9h6v6H9z"/><path fill="#eef9dc" d="M10 10h4v4h-4z"/>
      </svg><span class="center-label">CENTER</span>
    </button>
    <button id="mapButton" class="warp-drive-button" type="button" aria-label="Open Warp Drive to interstellar chart">
      <svg class="warp-mechanism" viewBox="0 0 48 52" aria-hidden="true" shape-rendering="crispEdges">
        <path fill="#080f20" d="M14 29h20v3h6v4h4v5h3v9H1v-9h3v-5h4v-4h6z"/>
        <path fill="#44516d" d="M14 32h20v3h6v6h4v6H4v-6h4v-6h6z"/>
        <path fill="#b0bccb" d="M16 31h16v3h6v4h4v6H6v-6h4v-4h6z"/>
        <path fill="#eff2dc" d="M16 31h16v3H16zm-6 5h6v3h-6zm-4 5h4v3H6z"/>
        <path fill="#748399" d="M32 34h6v4h4v6H28v-4h-4v-4h8z"/>
        <path fill="#080f20" d="M19 36h10v3h4v5H15v-5h4z"/>
        <path fill="#384759" d="M21 38h6v6h-6z"/>
        <g class="warp-handle">
          <path fill="#080f20" d="M19 13h10v27H19z"/>
          <path fill="#607990" d="M22 16h4v21h-4z"/>
          <path fill="#bad4db" d="M22 17h2v15h-2z"/>
          <path fill="#080f20" d="M18 1h12v3h4v4h3v10h-3v4h-4v3H18v-3h-4v-4h-3V8h3V4h4z"/>
          <path fill="#992f4e" d="M18 4h12v3h4v11h-4v4H18v-4h-4V7h4z"/>
          <path fill="#d95664" d="M19 4h10v3h3v9h-4v4H18v-4h-2V8h3z"/>
          <path fill="#f78b80" d="M20 6h7v3h3v3h-5V9h-5z"/>
        </g>
        <path fill="#8a9bad" d="M4 44h40v4H4z"/>
        <path fill="#dce5d8" d="M6 44h36v2H6z"/>
        <path fill="#18263d" d="M7 46h3v2H7zm31 0h3v2h-3z"/>
        <path class="warp-base-light" fill="#6b9991" d="M19 46h10v2H19z"/>
      </svg>
      <span class="warp-label">Warp Drive</span>
    </button>
    </div>
  </div>
  <div id="welcome" class="overlay visible" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="welcome-card glass">
      <section id="mainMenuStage" class="menu-stage main-menu-stage">
        <span class="version-chip main-menu-version">v1.5.3</span>
        <div id="welcomeTitle" class="hero-logo" role="heading" aria-level="1" aria-label="SpaceBitz">
          <img class="hero-wordmark" src="./assets/spacebitz-title.svg" alt="" width="696" height="156" aria-hidden="true">
        </div>
        <div class="main-menu-actions">
          <button id="startGame" class="button menu-choice menu-choice-primary"><span>START GAME</span></button>
          <button id="multiplayerGame" class="button menu-choice"><span>MULTIPLAYER</span></button>
          <button id="menuSettings" class="button menu-choice"><span>SETTINGS</span></button>
        </div>
      </section>

      <section id="universeMenuStage" class="menu-stage generation-stage" hidden>
        <div class="generation-top"><button id="backToMain" class="text-button generation-back" type="button">← MAIN MENU</button><span class="eyebrow accent">NEW UNIVERSE</span></div>
        <div class="create-row"><label for="universeName">UNIVERSE NAME</label><input id="universeName" maxlength="40" value="My Universe" autocomplete="off"></div>
        <div class="create-row"><label for="universeSeed">SEED <small>OPTIONAL</small></label><input id="universeSeed" maxlength="64" placeholder="Leave blank for a surprise" autocomplete="off"></div>
        <div class="welcome-actions"><button id="newGame" class="button primary">START EXPLORING <span>↗</span></button><button id="solGame" class="button subtle">VISIT SOL</button></div>
        <div class="saved-heading">CONTINUE VOYAGE</div><div id="savedGames" class="saved-games"></div>
        <div class="welcome-foot generation-foot"><button id="importButton" class="text-button">IMPORT SAVE ↑</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="installButton" class="text-button" hidden>INSTALL APP ↓</button></div>
      </section>
    </div>
  </div>
  <div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card glass"><div class="modal-head"><div><div class="eyebrow" id="modalEyebrow">FIELD NOTES</div><h2 id="modalTitle">Details</h2></div><button id="modalClose" class="icon-button" aria-label="Close dialog">✕</button></div><div id="modalContent"></div></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="soundtrackAudio" preload="auto" autoplay playsinline loop src="./audio/nostalgic_melody_soft_synth.mp3"></audio>
  <script type="module" src="./main.js"></script>
</body>
</html>
